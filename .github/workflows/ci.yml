name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    name: Bridge (no firmware needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: C bridge unit tests
        run: make -C firmware-patch test
      - name: Transport unit tests
        run: npm test
      - name: Transport <-> C bridge
        run: npx tsx --test integration-tests/c-bridge.test.ts

  simulator:
    name: SDK <-> firmware simulator
    # Enable once both forks are wired (Milestone 1). Set repo variable ENABLE_SIM=1.
    if: vars.ENABLE_SIM == '1'
    runs-on: ubuntu-latest
    needs: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm i -g pnpm && npm install
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libsdl2-dev xvfb
      - name: Clone forks
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          CYPHEROCK_WORKSPACE: ${{ github.workspace }}/..
        run: ./scripts/setup.sh
      - name: Build SDK fork
        run: cd ../sdk && pnpm i && pnpm build
      - name: Build simulator
        run: ./scripts/build-simulator.sh
      - name: SDK tests against simulator
        run: xvfb-run -a env CYPHEROCK_SIM=1 ./scripts/run-tests.sh
