<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X1 Quest · Cypherock X1 Simulator Bridge</title>
  <meta name="description" content="A guided, game-style playground: every level is one real Cypherock SDK call answered by the real X1 firmware.">
  <meta name="theme-color" content="#050507">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/sora.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/game.css">
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="shell">
    <!-- Left rail: the level map -->
    <nav class="rail pane" aria-label="Levels">
      <div class="brand">
        <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true">
          <defs>
            <linearGradient id="brand-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8bff"/><stop offset="1" stop-color="#7a4dff"/></linearGradient>
          </defs>
          <rect width="32" height="32" rx="9" fill="url(#brand-g)"/>
          <rect x="9.5" y="9.5" width="13" height="13" rx="3.5" fill="none" stroke="#fff" stroke-width="2"/>
          <path d="M13 4.5v3M19 4.5v3M13 24.5v3M19 24.5v3M4.5 13h3M4.5 19h3M24.5 13h3M24.5 19h3" stroke="#fff" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
          <circle cx="16" cy="16" r="2.5" fill="#fff"/>
        </svg>
        <div>
          <b>X1 Quest</b>
          <small>Simulator Academy</small>
        </div>
      </div>
      <div class="rail-head">
        <span>Missions</span>
        <b class="badge-count" id="badge-count" title="Levels completed">0/11</b>
      </div>
      <div class="map" id="map"></div>
      <p class="rail-foot">Real firmware · real SDK · real packets</p>
    </nav>

    <!-- Centre: top bar + the current mission -->
    <div class="board pane">
      <header class="topbar">
        <div class="tabs">
          <a class="tab" id="home-link" href="../" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Overview
          </a>
          <span class="tab active">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9h4M8 7v4M15 10h.01M18 8h.01M7 4h10a5 5 0 0 1 5 5v4a5 5 0 0 1-5 5h-1l-2 2h-4l-2-2H7a5 5 0 0 1-5-5V9a5 5 0 0 1 5-5z"/></svg>Play
          </span>
          <a class="tab" href="https://github.com/XSTRANGER-7/cypherock-simulator-bridge#readme" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h5"/></svg>Docs
          </a>
        </div>

        <div class="xp" aria-label="Experience">
          <div class="rank" id="rank">Rookie</div>
          <div class="xpbar"><div class="xpfill" id="xpfill"></div></div>
          <div class="xptext" id="xptext">0 XP</div>
        </div>

        <div class="top-right">
          <div class="sim-chip off" id="sim-chip"><span class="led"></span><span id="sim-text">Simulator: checking</span></div>
          <details class="menu">
            <summary aria-label="Menu">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>
            </summary>
            <div class="menu-body">
              <button data-menu="unlock">Unlock all levels</button>
              <button data-menu="reset-device">Reset simulator state</button>
              <button data-menu="reset-progress">Reset my progress</button>
              <a href="/classic.html">Classic view (all buttons)</a>
            </div>
          </details>
        </div>
      </header>

      <main class="mission" id="mission" aria-live="polite"></main>
    </div>

    <!-- Right: the device, the wire and the packet feed -->
    <aside class="side pane">
      <div class="card wire-card">
        <div class="card-title">
          <h3>Live wire</h3>
          <span class="muted" id="wire-stats">0 sent · 0 received</span>
        </div>
        <div class="wire" id="wire">
          <div class="track"></div>
          <div class="node app">
            <span class="node-ic">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M7.5 8.5l2 1.5-2 1.5M11.5 12h3"/></svg>
            </span>
            <b>Your app</b><small>Cypherock SDK</small>
          </div>
          <div class="node bridge" id="bridge-node">
            <span class="node-ic">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v4M15 3v4M7 7h10v4a5 5 0 0 1-10 0z"/><path d="M12 16v5"/></svg>
            </span>
            <b>Bridge</b><small>TCP :52640</small>
          </div>
          <div class="node device">
            <div class="screen" id="screen"><span id="screen-text">OFF</span></div>
            <b>X1 firmware</b><small>simulator</small>
          </div>
          <div class="overflow" id="overflow"></div>
        </div>
        <div class="legend" id="legend"></div>
      </div>

      <div class="card feed-card">
        <div class="card-title">
          <h3>Packet feed</h3>
          <button class="ghost tiny" id="feed-clear">Clear</button>
        </div>
        <ol class="feed" id="feed"></ol>
      </div>
    </aside>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/game.js"></script>
</body>
</html>
